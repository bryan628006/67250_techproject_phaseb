<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/style.css">
    <script src="../static/script.js" defer></script>
</head>
<body onload="addYear()">

    <div class="container">
        <header class="header">
            <img id="logo" src="../static/Monomuse logo.png" alt="MonoMuse Museum Logo">
        </header>

        <nav class="nav_bar" id="mainNav">
            <button class="hamburger" onclick="toggleNav()">&#9776;</button>
            <a href="../index.html">Home</a>
            <a href="explore.html">Explore</a>
            <a href="exhibitions.html">Exhibitions</a>
            <a href="tickets.html">Tickets</a>
            <a href="checkout.html">Checkout</a>
        </nav>

        <main class="main">
            <form>
                <label for="name">Name: (required)</label>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email: (required)</label>
                <input type="email" id="email" name="email" required><br><br>

                <label for="quantity">Ticket Quantity: (required)</label>
                <input type="number" id="quantity" name="quantity" required><br><br>

                <button type="submit">Submit</button>
            </form>
        </main>

        <figure class="main_img">
            <!-- Space for main image if needed -->
        </figure>

        <footer class="footer">
            <p>&copy; <span id="copyYear"></span> MonoMuse. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
