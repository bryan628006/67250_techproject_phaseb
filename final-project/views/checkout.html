<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Purchase tickets to MonoMuse Museum. Secure your entry before arriving.">
    <title>Checkout — MonoMuse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/style.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="../static/script.js" defer></script>
</head>

<body onload="addYear()">

    <div class="container">

        <header class="header">
            <img id="logo" src="../static/Monomuse logo.png" alt="MonoMuse Museum Logo">
        </header>

        <nav class="nav_bar" id="mainNav">
            <button type="button" class="hamburger" onclick="toggleNav()"
                aria-label="Toggle navigation menu">&#9776;</button>
            <a href="../index.html">Home</a>
            <a href="explore.html">Explore</a>
            <a href="exhibitions.html">Exhibitions</a>
            <a href="tickets.html">Tickets</a>
            <a href="checkout.html">Checkout</a>
        </nav>

        <main class="main full-width-main">
            <h2>Buy Tickets</h2>
            <p>
                Complete the form below to secure your visit.
                Fields marked <strong>*</strong> are required.
                All tickets are priced at <strong>$18 per person</strong>.
            </p>

            <form id="checkoutForm" style="max-width: 560px; margin: 30px 0;">

                <label for="visitDate">Visit Date *</label>
                <input type="date" id="visitDate" name="visitDate" required aria-required="true">


                <label for="ticketType">Ticket Type *</label>
                <select id="ticketType" name="ticketType" required aria-required="true">
                    <option value="">— Select a ticket type —</option>
                    <option value="adult">Adult (General Admission)</option>
                    <option value="student">Student (valid student ID required at entry)</option>
                    <option value="member">Member (MonoMuse membership ID required)</option>
                </select>


                <label for="quantity">
                    Number of Tickets *
                    <span class="optional-label">(1 – 10)</span>
                </label>
                <input type="number" id="quantity" name="quantity" min="1" max="10" value="1" required
                    aria-required="true">


                <div class="price-summary" aria-live="polite" aria-label="Order total">
                    <span>Price per ticket: <strong>$18.00</strong></span>
                    <span id="totalDisplay">Total: $18.00</span>
                </div>

                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required aria-required="true" placeholder="you@example.com"
                    autocomplete="email">


                <label for="zipCode">
                    Zip Code
                    <span class="optional-label">(optional)</span>
                </label>
                <input type="text" id="zipCode" name="zipCode" maxlength="5" placeholder="15213" inputmode="numeric"
                    autocomplete="postal-code">


                <div class="checkbox-row">
                    <input type="checkbox" id="mailingList" name="mailingList">
                    <label for="mailingList">
                        Join our mailing list to receive exhibition updates and special offers
                    </label>
                </div>

                <button type="submit" id="placeOrderBtn">Place Order</button>

            </form>

        </main>

        <footer class="footer">
            <p>&copy; <span id="copyYear"></span> MonoMuse. All rights reserved.</p>
        </footer>

    </div>

</body>

</html>
